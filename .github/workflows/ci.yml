name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-coverage
          path: coverage
          retention-days: 14

  build:
    name: Production build and Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: citycare-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: End-to-end tests against the real API
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: citycare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      JWT_ACCESS_SECRET: ci-e2e-access-secret-that-is-long-enough-0123456789
      INTERNAL_API_KEY: ci-e2e-internal-key
      API_URL: http://localhost:5000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ebrahim2355/citycare-backend
          path: backend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Start the CityCare API with seeded demo data
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citycare
          REDIS_URL: redis://localhost:6379
          PORT: 5000
          CLIENT_URL: http://localhost:3000
          AUTH_RATE_LIMIT_MAX: 1000
          RATE_LIMIT_MAX: 100000
          EMAIL_SKIP_DOMAINS: citycare.com
          CRON_SECRET: ci-e2e-cron-secret
        run: |
          bun install --frozen-lockfile
          bunx prisma migrate deploy
          bun run seed
          bun run build
          nohup node dist/server.js > api.log 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://localhost:5000/api/v1/health && exit 0; sleep 2; done
          cat api.log
          exit 1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start the web app
        run: |
          nohup npm start > web.log 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && exit 0; sleep 2; done
          cat web.log
          exit 1
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            backend/api.log
            web.log
          retention-days: 7
